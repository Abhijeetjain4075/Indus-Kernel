# Prometheus configuration for the Indus Kernel.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: indus-dev

scrape_configs:
  - job_name: indus-kernel
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
