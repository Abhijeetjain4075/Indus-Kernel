[project.optional-dependencies]
dev = [
    "ipython>=8.30.0",
    "ipdb>=0.13.13",
    "watchfiles>=0.24.0",
    "debugpy>=1.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mike>=2.1.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.8.0",
    "hypothesis>=6.122.0",
    "locust>=2.32.0",
]
finetune = [
    "unsloth>=2025.2.0",
    "llamafactory>=0.9.4",
    "trl>=0.15.0",
    "axolotl>=0.9.0",
    "peft>=0.13.0",
    "transformers>=4.47.0",
    "datasets>=3.2.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.45.0",
]
all = [
    "indus-kernel[dev,docs,test,finetune]",
]

[project.scripts]
ik-kernel = "ik_kernel.cli:main"
ik = "ik_kernel.cli:main"

[project.urls]
Homepage = "https://indus-kernel.dev"
Repository = "https://github.com/indus-kernel/indus-kernel"
Documentation = "https://docs.indus-kernel.dev"
Issues = "https://github.com/indus-kernel/indus-kernel/issues"

# ============================================================================
# Build system
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/*"]

# ============================================================================
# uv workspace
# ============================================================================
[tool.uv.workspace]
members = [
