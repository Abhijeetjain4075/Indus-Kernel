    "llamafactory>=0.9.4",
    "trl>=0.15.0",
    "axolotl>=0.9.0",
    "peft>=0.13.0",
    "transformers>=4.47.0",
    "datasets>=3.2.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.45.0",
]
all = [
    "indus-kernel[dev,docs,test,finetune]",
]

[project.scripts]
ik-kernel = "ik_kernel.cli:main"
ik = "ik_kernel.cli:main"

[project.urls]
Homepage = "https://indus-kernel.dev"
Repository = "https://github.com/indus-kernel/indus-kernel"
Documentation = "https://docs.indus-kernel.dev"
Issues = "https://github.com/indus-kernel/indus-kernel/issues"

# ============================================================================
# Build system
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/*"]

# ============================================================================
# uv workspace
# ============================================================================
[tool.uv.workspace]
members = [
    "packages/ik_kernel",
    "packages/ik_memory",
    "packages/ik_reasoning",
    "packages/ik_planning",
    "packages/ik_router",
    "packages/ik_tools",
    "packages/ik_agents",
    "packages/ik_retrieval",
    "packages/ik_coding",
    "packages/ik_research",
    "packages/ik_workflow",
    "packages/ik_automation",
    "packages/ik_api",
    "packages/ik_security",
    "packages/ik_telemetry",
    "packages/ik_config",
    "packages/ik_registry",
    "packages/ik_context",
    "packages/ik_eval",
    "packages/ik_improvement",
    "packages/ik_distributed",
    "packages/ik_memory_os",
    "packages/ik_eventbus",
    "packages/ik_state",
    "packages/ik_sandbox",
    "packages/ik_protocols",
    "packages/ik_ttc",
    "packages/ik_gepa",
    "packages/ik_distill",
    "packages/ik_wasm",
    "packages/ik_sdk",
