[tool.uv.sources]
ik_kernel = { workspace = true }
ik_memory = { workspace = true }
ik_reasoning = { workspace = true }
ik_planning = { workspace = true }
ik_router = { workspace = true }
ik_tools = { workspace = true }
ik_agents = { workspace = true }
ik_retrieval = { workspace = true }
ik_coding = { workspace = true }
ik_research = { workspace = true }
ik_workflow = { workspace = true }
ik_automation = { workspace = true }
ik_api = { workspace = true }
ik_security = { workspace = true }
ik_telemetry = { workspace = true }
ik_config = { workspace = true }
ik_registry = { workspace = true }
ik_context = { workspace = true }
ik_eval = { workspace = true }
ik_improvement = { workspace = true }
ik_distributed = { workspace = true }
ik_memory_os = { workspace = true }
ik_eventbus = { workspace = true }
ik_state = { workspace = true }
ik_sandbox = { workspace = true }
ik_protocols = { workspace = true }
ik_ttc = { workspace = true }
ik_gepa = { workspace = true }
ik_distill = { workspace = true }
ik_wasm = { workspace = true }
ik_sdk = { workspace = true }

# ============================================================================
# Tooling configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "**/node_modules/**", "**/.venv/**"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "PTH",# flake8-use-pathlib
    "RET",# flake8-return
    "ASYNC",# flake8-async
    "S",  # flake8-bandit
    "RUF",# ruff-specific
]
ignore = [
    "E501",  # line-too-long
    "B008",  # function-call-in-default-argument
    "S101",  # assert
    "S104",  # hardcoded-bind-all-interfaces
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011", "N802", "N803"]
"**/__init__.py" = ["F401"]
"**/migrations/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["ik_"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["**/migrations/**", "**/tests/**", "**/node_modules/**"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "mem0.*", "e2b_code_interpreter.*", "mcp.*", "a2a_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external services)",
    "integration: Integration tests (require services)",
    "e2e: End-to-end tests (full system)",
    "chaos: Chaos/failure tests",
    "benchmark: Performance benchmarks",
    "regression: Regression tests",
    "slow: Slow tests (>10s)",
    "gpu: Tests requiring GPU",
    "network: Tests requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning:moto",
    "ignore::DeprecationWarning:botocore",
    "ignore::DeprecationWarning:starlette",
    "ignore::PendingDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "except ImportError:",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

# ============================================================================
# Hatch envs
# ============================================================================
[tool.hatch.envs.default]
features = ["all"]

[tool.hatch.envs.test]
features = ["test", "dev"]
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers>=4.8.0",
]
[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=packages --cov-report=html --cov-report=term {args:tests}"

[tool.hatch.envs.lint]
features = ["dev"]
[tool.hatch.envs.lint.scripts]
lint = "ruff check packages apps"
format = "ruff format packages apps"
typecheck = "mypy packages"
all = ["lint", "format", "typecheck"]
