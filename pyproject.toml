[project.optional-dependencies]
dev = [
    "ipython>=8.30.0",
    "ipdb>=0.13.13",
    "watchfiles>=0.24.0",
    "debugpy>=1.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mike>=2.1.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.8.0",
    "hypothesis>=6.122.0",
