[project]
name = "indus-kernel"
version = "0.1.0"
description = "The cognitive operating system that makes every AI system work together as one unified intelligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Indus Kernel Contributors" }
]
requires-python = ">=3.12"
keywords = ["ai", "agents", "llm", "orchestration", "operating-system", "kernel"]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    # Async
    "anyio>=4.7.0",
    "asyncio-throttle>=1.0.2",
    "tenacity>=9.0.0",
    # HTTP clients
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.4.0",
    "passlib[bcrypt]>=1.7.4",
    # Validation
    "jsonschema>=4.23.0",
    # Templating
    "jinja2>=3.1.5",
    # Logging
    "structlog>=24.4.0",
    "rich>=13.9.0",
    # Configuration
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    # Secrets
    "hvac>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.3",
    # Redis
    "redis[hiredis]>=5.2.0",
    # Vector DB
    "qdrant-client>=1.13.0",
    # Graph DB
    "neo4j>=5.27.0",
    # Event bus
    "nats-py>=2.10.0",
    # Object storage
    "boto3>=1.35.0",
    "minio>=7.2.0",
    # Temporal
    "temporalio>=1.6.0",
    # LLM ecosystem
    "litellm>=1.55.0",
    "tiktoken>=0.8.0",
    # LangGraph / LangChain core
    "langgraph>=0.2.50",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    # Memory
    "mem0ai>=1.0.0",
    # Web search
    "duckduckgo-search>=6.3.0",
    "tavily-python>=0.5.0",
    "firecrawl-py>=2.0.0",
    # DSPy
    "dspy>=2.6.0",
    # OpenTelemetry
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    # Prometheus
    "prometheus-client>=0.21.1",
    # Sandbox
    "e2b-code-interpreter>=1.0.0",
    # WebAssembly
    "wasmtime>=31.0.0",
    "extism>=1.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # A2A (Agent-to-Agent)
    "a2a-sdk>=1.0.0",
    # ID generation
    "uuid7>=0.1.0",
    # Time
    "python-dateutil>=2.9.0",
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.8.0",
    # Linting
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    # Type stubs
    "types-PyYAML",
    "types-redis",
    "types-python-dateutil",
