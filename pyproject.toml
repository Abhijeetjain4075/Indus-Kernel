# ============================================================================
# Tooling configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "**/node_modules/**", "**/.venv/**"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "PTH",# flake8-use-pathlib
    "RET",# flake8-return
    "ASYNC",# flake8-async
    "S",  # flake8-bandit
    "RUF",# ruff-specific
]
ignore = [
    "E501",  # line-too-long
    "B008",  # function-call-in-default-argument
    "S101",  # assert
    "S104",  # hardcoded-bind-all-interfaces
    # M11 packages come from a different style guide (densely-packed
    # one-liners are intentional for legibility of contracts). We keep
    # the imports-clean and the names-correct, but allow compact form.
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
    "N806",  # non-lowercase-variable-in-function (ALL_CAPS in some adapter)
    "N802",  # invalid-function-name (preserve M11 contract names)
    "N812",  # lowercase-imported-as-non-lowercase (preserved module names)
    "N818",  # error-suffix-on-exception-name (M11 contract names preserved)
    "B905",  # zip-without-explicit-strict (test fixtures use zip(*x))
    "B904",  # raise-without-from-inside-except (re-raise in adapter paths)
    "UP042", # replace-str-enum (M11 contract uses str)
    "RUF005",# collection-literal-concatenation (test fixtures)
    "S105",  # hardcoded-password-string (test fixtures, not real passwords)
    "S311",  # suspicious-non-cryptographic-random (test fixtures)
    "I001",  # unsorted-imports (M11 inline try/except import blocks)
    "F841",  # unused-variable (test fixtures + temporary debugging)
    "F401",  # unused-import (re-exports for downstream consumers)
    "F811",  # redefined-while-unused (compat aliases re-exporting M11 names)
    "F541",  # f-string-missing-placeholders (logging templates)
    "C401",  # unnecessary-generator-set (perf-critical paths)
    "B007",  # unused-loop-control-variable (intentional index iteration)
    "E731",  # lambda-assignment (test fixtures)
    "E741",  # ambiguous-variable-name (M11 contract signatures)
    "S108",  # hardcoded-temp-file (test fixtures)
    "S603",  # subprocess-without-shell-equals-true (test fixtures)
    "S607",  # start-process-with-partial-path (test fixtures)
    "S110",  # try-except-pass (compat shims)
    "RET504",# unnecessary-assign (clarity over micro-perf)
    "RET505",# superfluous-else-return (clarity)
    "RUF012",# mutable-class-default (intentional defaults)
    "RUF013",# implicit-optional (intentional)
    "RUF015",# unnecessary-iterable-allocation (clarity)
    "RUF022",# unsorted-dunder-all (intentional)
    "RUF034",# useless-if-else (intentional)
    "RUF059",# unused-unpacked-variable (intentional)
    "SIM102",# collapsible-if (clarity)
    "SIM108",# if-else-block-instead-of-if-exp (clarity)
    "SIM115",# open-file-with-context-handler (file kept open intentionally)
    "UP041",# timeout-error-alias (compatibility)
    "N803",  # invalid-argument-name (M11 contract parameter names)
    "PTH",  # os.path is still valid Python; pathlib is one option
    "SIM105",# try/except/pass is more readable than contextlib.suppress
    "UP031", # % formatting is fine
    "S324",  # sha1 in non-security contexts (content-addressed ids)
    "C408",  # dict() vs {} is style
    "ASYNC230", # blocking I/O in async is sometimes intentional
    "UP037", # quoted annotations are fine
    "ASYNC240", # os.path in async is fine for our subprocess model
    "B018",   # useless expression as docstring marker
    "S103",   # chmod 0o755 for /bin/sh scripts is fine
    "S310",   # urlopen with explicit http(s) is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011", "N802", "N803", "F401", "F841", "RET504", "E741", "SIM115", "B007", "B905", "RUF015", "RUF059"]
"**/__init__.py" = ["F401", "F811", "E402"]
"**/migrations/*.py" = ["N999"]
"packages/ik_*/ik_*/temporal.py" = ["E701", "E702", "W291", "N802"]
"apps/**/*.ts" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ik_"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Pragmatic type checking. We rely on Pydantic at module boundaries
# (typed data contracts), and on pytest at runtime. Strict annotations
# on every internal helper add noise without changing correctness.
strict = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_any_unimported = false
no_implicit_optional = false
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["(migrations|tests|node_modules)/"]
plugins = ["pydantic.mypy"]
disable_error_code = [
    "union-attr",     # optional chaining noise
    "arg-type",       # dynamic config
    "attr-defined",   # dynamic monkey-patching
    "call-overload",  # heterogeneous dict usage
    "no-untyped-def", # we don't annotate every internal helper
    "no-untyped-call",# we don't annotate every internal helper
    "no-any-return",  # useful for adapters
    "var-annotated",  # inferred types are fine
    "assignment",     # dynamic dispatch
    "return-value",   # duck-typing
    "typeddict-item", # pydantic vs TypedDict overlap
    "index",          # nullable indexing
    "operator",       # duck-typed callables
    "misc",           # generator narrowing
    "list-item",      # dynamic list construction
    "no-redef",       # intentional re-imports
    "call-arg",       # pydantic models with optional fields
]

[[tool.mypy.overrides]]
module = ["litellm.*", "mem0.*", "e2b_code_interpreter.*", "mcp.*", "a2a_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external services)",
    "integration: Integration tests (require services)",
    "e2e: End-to-end tests (full system)",
    "chaos: Chaos/failure tests",
    "benchmark: Performance benchmarks",
    "regression: Regression tests",
    "slow: Slow tests (>10s)",
    "gpu: Tests requiring GPU",
    "network: Tests requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning:moto",
    "ignore::DeprecationWarning:botocore",
    "ignore::DeprecationWarning:starlette",
    "ignore::PendingDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "except ImportError:",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

# ============================================================================
# Hatch envs
# ============================================================================
[tool.hatch.envs.default]
features = ["all"]

[tool.hatch.envs.test]
features = ["test", "dev"]
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers>=4.8.0",
]
[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=packages --cov-report=html --cov-report=term {args:tests}"

[tool.hatch.envs.lint]
features = ["dev"]
[tool.hatch.envs.lint.scripts]
lint = "ruff check packages apps"
format = "ruff format packages apps"
typecheck = "mypy packages"
all = ["lint", "format", "typecheck"]
