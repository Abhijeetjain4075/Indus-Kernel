[project]
name = "ik_automation"
version = "0.1.0"
description = "Automation Engine — cron, event, webhook triggers"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_automation"]
