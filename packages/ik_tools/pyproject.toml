[project]
name = "ik_tools"
version = "0.1.0"
description = "Tool Manager — registration, schema validation, MCP-native, sandboxed execution"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_tools"]
