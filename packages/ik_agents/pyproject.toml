[project]
name = "ik_agents"
version = "0.1.0"
description = "Agent Orchestrator — LangGraph-based, GoA-style multi-agent, A2A-native"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_agents"]
