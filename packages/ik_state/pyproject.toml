[project]
name = "ik_state"
version = "0.1.0"
description = "State Manager — Temporal + Postgres + NATS KV + Vault"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_state"]
