[project]
name = "ik_eventbus"
version = "0.1.0"
description = "Event Bus — NATS JetStream 2.11, pub/sub, durable streams"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_eventbus"]
