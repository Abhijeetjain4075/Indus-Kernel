[project]
name = "ik_sdk"
version = "0.1.0"
description = "Indus SDK — Python client for the kernel API"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_sdk"]
