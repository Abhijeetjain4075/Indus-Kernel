[project]
name = "ik_config"
version = "0.1.0"
description = "Configuration — layered, hot-reload, per-tenant, Vault-backed"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_config"]
