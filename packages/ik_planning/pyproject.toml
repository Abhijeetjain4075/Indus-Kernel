[project]
name = "ik_planning"
version = "0.1.0"
description = "Planning Engine — goal decomposition, DAG construction, replanning, verification"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_planning"]
