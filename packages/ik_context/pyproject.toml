[project]
name = "ik_context"
version = "0.1.0"
description = "Context Manager — StreamingLLM, YaRN, LongRoPE, Infini-Attention, Ring Attention"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_context"]
