[project]
name = "ik_indus_llm"
version = "0.3.0"
description = "Indus — a real local foundation model (decoder-only transformer with GQA, RoPE, RMSNorm, optional MoE/SwiGLU). Provides the native LLM backend for ik_router."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]
dependencies = [
    "torch>=2.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_indus_llm"]
include = ["ik_indus_llm/artifacts/**/*"]
