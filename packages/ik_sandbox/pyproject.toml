[project]
name = "ik_sandbox"
version = "0.1.0"
description = "Execution Sandbox — E2B, gVisor, Wasmtime, Wassette, Modal"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_sandbox"]
