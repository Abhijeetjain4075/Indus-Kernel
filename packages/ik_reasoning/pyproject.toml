[project]
name = "ik_reasoning"
version = "0.1.0"
description = "Reasoning Engine — 13 real strategies (CoT, ToT, GoT, ReAct, Reflexion, LLM Compiler, TTC, ...)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]
dependencies = [
    "pydantic>=2.6.0",
    "ik_router>=0.1.0",
    "ik_memory>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_reasoning"]
