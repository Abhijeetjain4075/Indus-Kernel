[project]
name = "ik_coding"
version = "0.1.0"
description = "Coding Engine — Aider + OpenHands + SWE-agent + mini-SWE-agent adapters"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_coding"]
