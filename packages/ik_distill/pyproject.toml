[project]
name = "ik_distill"
version = "0.1.0"
description = "Distillation Pipeline — R1-style 6-stage recipe (pure RL → cold-start SFT → ...)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_distill"]
