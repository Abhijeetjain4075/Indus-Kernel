[project]
name = "ik_kernel"
version = "0.1.0"
description = "Indus Kernel core — app factory, CLI, lifespan, dependency injection"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_kernel"]
