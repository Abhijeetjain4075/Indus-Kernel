[project]
name = "ik_memory"
version = "0.1.0"
description = "Memory Engine — working, short-term, long-term, episodic, semantic, procedural memory"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_memory"]
