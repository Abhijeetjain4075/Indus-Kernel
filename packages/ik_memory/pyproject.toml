[project]
name = "ik_memory"
version = "0.1.0"
description = "Memory Engine — working, short-term, long-term, episodic, semantic, procedural memory"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.6.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_memory"]
