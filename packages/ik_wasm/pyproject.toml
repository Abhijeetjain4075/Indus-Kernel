[project]
name = "ik_wasm"
version = "0.1.0"
description = "WASM Plugin Runtime — Wasmtime + WASI 0.2 + Component Model + Extism + Wassette"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_wasm"]
