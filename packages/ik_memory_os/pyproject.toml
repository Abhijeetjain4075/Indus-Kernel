[project]
name = "ik_memory_os"
version = "0.1.0"
description = "Memory Operating System — unified API over Mem0 + Qdrant + Neo4j + Redis + Postgres"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Indus Kernel Contributors" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ik_memory_os"]
