[workspace]
resolver = "2"
members = [
    "crates/ik-vector",
    "crates/ik-router",
    "crates/ik-graph",
    "crates/ik-eventbus",
    "crates/ik-sandbox",
    "crates/ik-crypto",
    "crates/ik-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Indus Kernel Contributors"]
repository = "https://github.com/indus-kernel/indus-kernel"
homepage = "https://indus-kernel.dev"
description = "Indus Kernel — the cognitive operating system that makes every AI system work together as one unified intelligence."
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
# HTTP / gRPC
tonic = "0.12"
axum = "0.7"
hyper = { version = "1.5", features = ["full"] }
tower = "0.5"
tower-http = "0.6"
# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
protobuf = "3.7"
prost = "0.13"
# Errors
anyhow = "1.0"
thiserror = "2.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Metrics
prometheus = "0.13"
# DB
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
# Vector / graph
qdrant-client = "1.13"
neo4rs = "0.9"
# Event bus
async-nats = "0.37"
# Crypto
ring = "0.17"
jsonwebtoken = "9.3"
# WASM
wasmtime = "31.0"
wasmtime-wasi = "31.0"
# Utilities
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1.20"
bytes = "1.8"
url = "2.5"
# Testing
tokio-test = "0.4"
mockall = "0.13"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
