syntax = "proto3";

package indus.kernel.v1;

// Common types used across the kernel's wire protocol.

// W3C Trace Context — propagated through every kernel call.
message TraceContext {
  string traceparent = 1;       // e.g. "00-{trace_id}-{span_id}-{flags}"
  string tracestate = 2;
  string trace_id = 3;
  string span_id = 4;
}

// Result type for fallible operations.
message Result {
  bool ok = 1;
  bytes value = 2;                // JSON
  string error_message = 3;
  string error_code = 4;
}

// Pagination
message PageRequest {
  int32 limit = 1;
  int32 offset = 2;
  string cursor = 3;
}

message PageInfo {
  int32 total = 1;
  string next_cursor = 2;
  bool has_more = 3;
}
