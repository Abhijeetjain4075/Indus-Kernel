syntax = "proto3";

package indus.kernel.v1;

import "common.proto";

// MemoryObject — the kernel's memory representation.
message MemoryObject {
  string id = 1;
  string content = 2;
  MemoryType type = 3;
  MemoryScope scope = 4;
  float importance = 5;
  repeated string tags = 6;
  string source = 7;
  string tenant_id = 8;
  string agent_id = 9;
  string user_id = 10;
  int64 created_at_unix_ms = 11;
  int64 last_accessed_unix_ms = 12;
  int32 access_count = 13;
  int64 ttl_unix_ms = 14;
  int32 version = 15;
  string embeddings_ref = 16;
  string graph_ref = 17;
  repeated string lineage = 18;
}

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  EPISODIC = 1;
  SEMANTIC = 2;
  PROCEDURAL = 3;
  GRAPH = 4;
  COMPACTION = 5;
  REFLECTION = 6;
}

enum MemoryScope {
  MEMORY_SCOPE_UNSPECIFIED = 0;
  WORKING = 1;
  SHORT = 2;
  LONG = 3;
}

message MemoryWriteRequest {
  MemoryObject object = 1;
  string idempotency_key = 2;
}

message MemoryReadRequest {
  string id = 1;
  string version = 2;
}

message MemoryQueryRequest {
  string query = 1;
  int32 k = 2;
  repeated MemoryScope scopes = 3;
  float recency_weight = 4;
  float importance_weight = 5;
  float relevance_weight = 6;
  repeated string tags = 7;
}

message MemoryQueryResult {
  repeated MemoryObject objects = 1;
  map<string, float> scores = 2;
}
