# Alembic configuration for the Indus Kernel.
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migration scripts
script_location = db/migrations

# Template for new migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Prepend to revision filenames
truncate_slug_length = 40

# Set in code via env.py from settings
# sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]
# Automatically format migration scripts after generation
hooks = black
black.type = console_scripts
black.entrypoint = uv run ruff format
black.options = - REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
